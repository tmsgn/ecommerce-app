name: ecommerce
description: "SHOPEASE — A premium Flutter e-commerce app with Firebase. Group 7 Mobile App Development Assignment."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  font_awesome_flutter: 10.8.0
  carousel_slider: ^5.1.2
  google_nav_bar: ^5.0.7
  google_sign_in: ^6.2.2
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - lib/assets/

flutter_native_splash:
  # Baked-in full image — dark background + icon + text all in one PNG
  # No separate color/icon to avoid any transparency artifacts
  color: "#09090B"
  color_dark: "#09090B"
  background_image: lib/assets/splash_full.png
  background_image_dark: lib/assets/splash_full.png

  fullscreen: false

  # Android 12+ uses adaptive icon — keep background solid + icon only
  android_12:
    color: "#09090B"
    color_dark: "#09090B"
    image: lib/assets/splash_full.png
    image_dark: lib/assets/splash_full.png
    icon_background_color: "#09090B"
    icon_background_color_dark: "#09090B"

  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: lib/assets/app_icon.png
  min_sdk_android: 23
  # Adaptive icon: solid dark background, full image as foreground
  adaptive_icon_background: "#09090B"
  adaptive_icon_foreground: lib/assets/app_icon.png
  # Ensure no white padding is added
  remove_alpha_ios: true
  background_color_ios: "#09090B"
  web:
    generate: false
